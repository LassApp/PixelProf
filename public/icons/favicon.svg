<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 34 34" fill="none">
  <!-- sfondo navy #17232D -->
  <rect width="34" height="34" rx="6" fill="#17232D"/>
  <!-- esagono esterno: crema #F2E8D5 -->
  <polygon points="17,2 30,9.5 30,24.5 17,32 4,24.5 4,9.5"
    fill="none" stroke="#F2E8D5" stroke-width="1.4" stroke-opacity=".85"/>
  <!-- esagono interno: velo oliva #6E7A50 con filo crema -->
  <polygon points="17,7 26,12 26,22 17,27 8,22 8,12"
    fill="#6E7A50" fill-opacity=".45" stroke="#F2E8D5" stroke-width=".9" stroke-opacity=".55"/>
  <!-- P stem -->
  <rect x="12" y="11" width="2.2" height="12" rx="1.1" fill="#F2E8D5"/>
  <!-- P bowl -->
  <path d="M14.2 11 Q21.5 11 21.5 15.5 Q21.5 20 14.2 20"
    stroke="#F2E8D5" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <!-- accenti pixel: oliva chiaro #8B9968 (derivato dell'oliva per fondo scuro) e crema -->
  <circle cx="26" cy="8" r="1.6" fill="#8B9968" opacity=".9"/>
  <circle cx="8" cy="26" r="1.3" fill="#F2E8D5" opacity=".65"/>
</svg>
